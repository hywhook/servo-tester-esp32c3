; PlatformIO project for ESP32-C3 DevKitM-1 — Servo Tester (Nivel 3)
; EXTENDES Nivel 2 con: MULTICANAL (4 servos), BLE (NimBLE) y GRAFICO de
; respuesta. El BLE (NimBLE) viene INCLUIDO en el framework arduino de ESP32,
; no se necesita librería extra. Construido para framework-arduinoespressif32.
;
; IMPORTANTE (USB-CDC gotcha, igual que N1/N2):
;   No se pone build_flags = -D ARDUINO_USB_CDC_ON_BOOT=1. Sin ese flag,
;   Serial == UART0 (GPIO1/3). El DevKitM-1 NO saca UART0 por el USB-C (ese
;   puerto USB es solo para esptool). Toda la info va en la OLED.
;   (Nota: GPIO1 se usa aqui como senal de servo CH2; GPIO3 como V-sense.)

[env:esp32-c3-devkitm-1]
platform        = espressif32
board           = esp32-c3-devkitm-1
framework       = arduino
monitor_speed   = 115200
upload_speed    = 921600
board_build.flash_mode = dio

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5
    madhephaestus/ESP32Servo @ ^0.13.0
    adafruit/Adafruit INA219 @ ^1.2.2
