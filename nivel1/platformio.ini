; PlatformIO project for ESP32-C3 Super Mini — Servo Tester (Nivel 1)
; Built for framework-arduinoespressif32 7.0.1
;
; IMPORTANT (USB-CDC gotcha):
;   We deliberately DO NOT set build_flags = -D ARDUINO_USB_CDC_ON_BOOT=1.
;   This core (7.0.1) lacks usb_serial.h for the C3, so that flag breaks the
;   build with "'Serial' was not declared". Without it, Serial == UART0
;   (GPIO1/TX, GPIO3/RX) which the Super Mini does NOT route to its USB
;   connector. Do not expect host output on Serial — use the OLED instead.
;   Upload goes over native USB via esptool (/dev/ttyACM0); no BOOT button.

[env:esp32-c3-devkitm-1]
platform        = espressif32
board           = esp32-c3-devkitm-1
framework       = arduino
monitor_speed   = 115200
upload_speed    = 921600
board_build.flash_mode = dio

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5
    madhephaestus/ESP32Servo @ ^0.13.0
